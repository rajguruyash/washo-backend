<script>
/* ───────── helpers ───────── */
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eo5 = (x) => 1 - Math.pow(1 - x, 5);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eback = (x) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function ic(name, size = 16, extra = '', sw = 2) {
  return `<svg class="ico ${extra}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}
function fx(el, { o = 1, x = 0, y = 0, s = 1, b = 0, r = 0 } = {}) {
  el.style.opacity = o;
  el.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  el.style.filter = b > 0.05 ? `blur(${b}px)` : 'none';
}
// blur-in like the site's BlurText: up from below, out of a blur
const bin = (p, dy = 50, bl = 18) => ({ o: eo(p), y: (1 - eo(p)) * dy, b: (1 - eo(p)) * bl });
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ───────── ambient: mandala, lights, bokeh ───────── */
(function buildMandala() {
  let s = '<svg viewBox="0 0 1000 1000" width="1500" height="1500" fill="none" stroke="#ffd84d" stroke-width="1.6">';
  for (const r of [120, 190, 300, 390, 470]) s += `<circle cx="500" cy="500" r="${r}" stroke-opacity="${r === 300 ? 0.9 : 0.55}"/>`;
  for (let i = 0; i < 24; i++) { const a = (i / 24) * 360; s += `<path transform="rotate(${a} 500 500)" d="M500 190 C 540 230, 540 270, 500 300 C 460 270, 460 230, 500 190 Z"/>`; }
  for (let i = 0; i < 12; i++) { const a = (i / 12) * 360 + 15; s += `<path transform="rotate(${a} 500 500)" d="M500 300 C 560 330, 560 370, 500 390 C 440 370, 440 330, 500 300 Z" stroke-opacity="0.7"/>`; }
  for (let i = 0; i < 48; i++) { const a = (i / 48) * Math.PI * 2; s += `<circle cx="${500 + Math.cos(a) * 430}" cy="${500 + Math.sin(a) * 430}" r="4" fill="#ffd84d" fill-opacity="0.8" stroke="none"/>`; }
  for (let i = 0; i < 8; i++) { const a = (i / 8) * 360; s += `<path transform="rotate(${a} 500 500)" d="M500 60 L 520 120 L 500 110 L 480 120 Z" fill="#ffd84d" fill-opacity="0.4" stroke="none"/>`; }
  $('mandala').innerHTML = s + '</svg>';
})();
const lightDots = [];
(function buildLights() {
  // two strings of small festive lights, sagging across the top
  const host = $('lights');
  const strings = [{ y0: 40, sag: 120, n: 22 }, { y0: 10, sag: 70, n: 18 }];
  const cols = ['#ffd84d', '#ffb547', '#ff8a3d', '#ffd84d', '#9bbfff'];
  strings.forEach((st, si) => {
    for (let i = 0; i < st.n; i++) {
